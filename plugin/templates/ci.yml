name: aidlc
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: {{runsOn}}
    steps:
      - uses: {{checkout}}
        with:
          fetch-depth: 0
      - uses: {{setupNode}}
        with:
          node-version: lts/*
          package-manager-cache: false
      - run: node .aidlc/bin/aidlc.mjs check --ci
