name: ci
on:
  push:
    branches: ['**'] # branch pushes only: release tags point at commits CI already tested
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26] # every Node release line still supported upstream
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Tests
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=tests.tap
      - uses: actions/setup-go@v7 # macOS runners have no go on the PATH
        with:
          go-version-file: plugin/packs/go/reference/go.mod
          cache: false
      - name: Go reference
        run: go version && cd plugin/packs/go/reference && go vet ./... && go test ./... # the stack pack's reference, notes and the control plane, runs its own tests
      - name: No temp folders left
        run: node -e "const l = require('fs').readdirSync(require('os').tmpdir()).filter((n) => n.startsWith('aidlc-test-')); if (l.length) { console.error(l.join('\\n')); process.exit(1); }"
      - name: Docs check
        run: node plugin/cli/aidlc.mjs check docs 2>&1 | tee check.txt
      - name: Summary
        if: always()
        run: |
          count() { grep -m1 "^# $1 " tests.tap 2>/dev/null | awk '{print $3}'; }
          {
            echo "## CI: plugin $(node -p "require('./plugin/.claude-plugin/plugin.json').version") on $RUNNER_OS, Node $(node -v)"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Tests | $(count pass) passed, $(count fail) failed, $(count skipped) skipped |"
            echo "| Docs check | $([ -s check.txt ] && echo "$(wc -l < check.txt) finding(s)" || echo clean) |"
            echo "| CLI source | $(cat plugin/cli/*.mjs plugin/cli/lib/*.mjs | wc -l) lines |"
            if grep -q "^not ok" tests.tap 2>/dev/null; then
              echo
              echo "### Failing tests"
              grep "^not ok" tests.tap | sed 's/^not ok [0-9]* - /- /'
            fi
            if [ -s check.txt ]; then
              echo
              echo "### Docs check"
              echo '```'
              cat check.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
